name: sequential_p2_retrieval_shard_b
notes: Only the categorical retrieval strategy changes. Two-person official shard
  assigned to B.
dataset_path: benchmark/tuvi_golden_dataset/release/tuviqa_v1_release.jsonl
output_dir: benchmark/tuvi_golden_dataset/sequential_ablation/results/P2_retrieval/shards/B
configs:
- name: p2_sparse
  base_config_path: configs/ablation_sequential/locked_phase_1.yaml
  overrides:
    experiment_id: sequential_p2_sparse
    name: Sequential P2 - sparse
    graph_retrieval_enabled: false
    dense_retrieval_enabled: false
    sparse_retrieval_enabled: true
- name: p2_graph_sparse
  base_config_path: configs/ablation_sequential/locked_phase_1.yaml
  overrides:
    experiment_id: sequential_p2_graph_sparse
    name: Sequential P2 - graph+sparse
    graph_retrieval_enabled: true
    dense_retrieval_enabled: false
    sparse_retrieval_enabled: true
- name: p2_dense_sparse
  base_config_path: configs/ablation_sequential/locked_phase_1.yaml
  overrides:
    experiment_id: sequential_p2_dense_sparse
    name: Sequential P2 - dense+sparse
    graph_retrieval_enabled: false
    dense_retrieval_enabled: true
    sparse_retrieval_enabled: true
- name: p2_graph_dense_sparse
  base_config_path: configs/ablation_sequential/locked_phase_1.yaml
  overrides:
    experiment_id: sequential_p2_graph_dense_sparse
    name: Sequential P2 - graph+dense+sparse
    graph_retrieval_enabled: true
    dense_retrieval_enabled: true
    sparse_retrieval_enabled: true
